    <style>
      /* ── Variables (same as LP) ── */
      :root {
        --primary: #f16625;
        --primary-dark: #d4551a;
        --heading: #1b1b1b;
        --text: #444444;
        --border: #ececec;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: #fefbf7;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      img {
        max-width: 100%;
        display: block;
      }

      a {
        text-decoration: none;
        transition: all 0.3s ease;
      }

      /* ── HEADER ── */
      .ty-header {
        background: #fff;
        border-bottom: 1px solid rgba(0, 0, 0, 0.12);
        padding: 18px 0;
        text-align: center;
      }

      .ty-header img {
        height: 47px;
        width: auto;
        display: inline-block;
      }

      /* ── MAIN CONTENT ── */
      .ty-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        position: relative;
        overflow: hidden;
      }

      /* Subtle decorative background circle */
      .ty-main::before {
        content: '';
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(241, 102, 37, 0.07) 0%, transparent 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
      }

      .ty-card {
        position: relative;
        z-index: 1;
        background: #fff;
        border-radius: 24px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.07);
        padding: 60px 56px;
        max-width: 600px;
        width: 100%;
        text-align: center;
      }

      /* ── CHECK ICON ── */
      .ty-icon {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: linear-gradient(135deg, #fff5ee 0%, #ffe8d6 100%);
        border: 2px solid rgba(241, 102, 37, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 32px;
        animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

      .ty-icon i {
        font-size: 42px;
        color: var(--primary);
        line-height: 1;
      }

      @keyframes pop-in {
        from {
          transform: scale(0.5);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ── TAG LINE ── */
      .ty-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(241, 102, 37, 0.08);
        color: var(--primary);
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 6px 14px;
        border-radius: 30px;
        margin-bottom: 20px;
      }

      .ty-tag .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
        box-shadow: 0 0 8px var(--primary);
      }

      /* ── HEADING ── */
      .ty-heading {
        font-family: 'Satoshi', sans-serif;
        font-size: 42px;
        font-weight: 700;
        line-height: 1.1;
        color: var(--heading);
        margin-bottom: 16px;
      }

      .ty-heading span {
        color: var(--primary);
      }

      /* ── BODY TEXT ── */
      .ty-body {
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        color: #555;
        line-height: 1.8;
        margin-bottom: 36px;
      }

      /* ── DIVIDER ── */
      .ty-divider {
        width: 48px;
        height: 3px;
        background: var(--primary);
        border-radius: 30px;
        margin: 0 auto 32px;
      }

      /* ── BACK BUTTON ── */
      .ty-back-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 15px 36px;
        background: var(--primary);
        color: #fff;
        border-radius: 10px;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        font-weight: 600;
        box-shadow: 0 12px 30px rgba(241, 102, 37, 0.3);
        transition: all 0.3s ease;
      }

      .ty-back-btn i {
        font-size: 16px;
        transition: transform 0.3s ease;
      }

      .ty-back-btn:hover {
        background: var(--primary-dark);
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 18px 40px rgba(241, 102, 37, 0.35);
      }

      .ty-back-btn:hover i {
        transform: translateX(-4px);
      }

      /* ── HIGHLIGHTS STRIP ── */
      .ty-highlights {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        margin-top: 40px;
        padding-top: 32px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }

      .ty-highlight-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .ty-highlight-item strong {
        font-family: 'Satoshi', sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--primary);
        line-height: 1;
      }

      .ty-highlight-item span {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        color: #888;
        text-align: center;
      }

      .ty-highlight-sep {
        width: 1px;
        height: 36px;
        background: var(--border);
        flex-shrink: 0;
      }

      /* ── FOOTER ── */
      .ty-footer {
        background: #1c3d90;
        padding: 22px 20px;
        text-align: center;
      }

      .ty-footer-logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        padding: 6px 14px;
        border-radius: 6px;
        margin-bottom: 14px;
      }

      .ty-footer-logo img {
        height: 34px;
        width: auto;
        display: inline-block;
      }

      .ty-footer-address {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.7;
        margin-bottom: 10px;
      }

      .ty-footer-copy {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin: 0;
      }

      /* ── RESPONSIVE ── */
      @media (max-width: 767px) {
        .ty-header img {
          height: 40px;
        }

        .ty-card {
          padding: 40px 28px;
          border-radius: 18px;
        }

        .ty-icon {
          width: 74px;
          height: 74px;
          margin-bottom: 24px;
        }

        .ty-icon i {
          font-size: 34px;
        }

        .ty-heading {
          font-size: 32px;
        }

        .ty-body {
          font-size: 15px;
          margin-bottom: 28px;
        }

        .ty-highlights {
          gap: 16px;
        }

        .ty-highlight-item strong {
          font-size: 20px;
        }

        .ty-highlight-sep {
          display: none;
        }
      }

      @media (max-width: 480px) {
        .ty-card {
          padding: 32px 20px;
        }

        .ty-heading {
          font-size: 28px;
        }

        .ty-body {
          font-size: 14px;
        }

        .ty-back-btn {
          width: 100%;
          justify-content: center;
          padding: 14px 24px;
        }

        .ty-highlights {
          gap: 12px;
          margin-top: 28px;
          padding-top: 24px;
        }

        .ty-highlight-item strong {
          font-size: 18px;
        }

        .ty-highlight-item span {
          font-size: 11px;
        }
      }
    </style>

      // Auto-download the brochure PDF on every page load (including refresh)
      window.addEventListener('load', function () {
        var a = document.createElement('a');
